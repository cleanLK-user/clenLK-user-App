<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean.lk - User App</title>
    <style>
        :root {
            --primary: #2e7d32;
            --bg: #f9f9f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body.dark-mode {
            --primary: #81c784;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg); color: var(--text-color); padding: 15px; padding-bottom: 60px; transition: background 0.3s; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--primary); color: white; padding: 12px 15px; border-radius: 8px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        input, textarea, select { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; background: inherit; color: inherit; }
        button { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { opacity: 0.9; }
        .theme-toggle { background: #333; color: #fff; border-radius: 20px; padding: 5px 10px; font-size: 11px; width: auto; }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, collection, addDoc, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDtOiVEWrArAyQgqvqsU2TVI2cdTHCEisO",
        authDomain: "cleanlk-76d7a.firebaseapp.com",
        projectId: "cleanlk-76d7a",
        storageBucket: "cleanlk-76d7a.firebasestorage.app",
        messagingSenderId: "411277096952",
        appId: "1:411277096952:web:dc356b1c5c88d847b4c80d",
        measurementId: "G-E2E1L4LH88"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.db = db;

      // Complaint Submission
      window.submitComplaint = async function(e) {
          e.preventDefault();
          const user = document.getElementById('userName').value || "Anonymous";
          const location = document.getElementById('userLocation').value;
          const text = document.getElementById('userDescription').value;
          const photoInput = document.getElementById('userPhoto');

          let photoData = "";
          if(photoInput.files[0]) {
              const reader = new FileReader();
              reader.onload = async function(event) {
                  photoData = event.target.result;
                  await saveToFirestore(user, location, text, photoData);
              };
              reader.readAsDataURL(photoInput.files[0]);
          } else {
              await saveToFirestore(user, location, text, "");
          }
      };

      async function saveToFirestore(user, location, text, photo) {
          try {
              const now = new Date();
              const docRef = await addDoc(collection(db, "complaints"), {
                  user: user,
                  location: location,
                  text: text,
                  photo: photo,
                  status: "සලකා බලමින් සිටියි.",
                  date: now.toLocaleDateString(),
                  time: now.toLocaleTimeString()
              });
              alert("✅ පැමිණිල්ල සාර්ථකව යොමු කරන ලදී! ඔබේ ID එක: " + docRef.id);
              document.getElementById('complaintForm').reset();
          } catch(err) {
              console.error(err);
              alert("දෝෂයක් ඇති විය.");
          }
      }

      // Status Tracking
      window.trackStatus = async function() {
          const trackId = document.getElementById('trackId').value.trim();
          const resDiv = document.getElementById('trackResult');
          if(!trackId) return alert("ID එක ඇතුළත් කරන්න.");
          
          resDiv.style.display = "block";
          resDiv.innerHTML = "පරීක්ෂා කරමින් පවතී...";

          try {
              const docSnap = await getDoc(doc(db, "complaints", trackId));
              if(docSnap.exists()) {
                  const data = docSnap.data();
                  resDiv.innerHTML = `
                      <p><b>ස්ථානය:</b> ${data.location}</p>
                      <p><b>විස්තරය:</b> ${data.text}</p>
                      <p><b>තත්ත්වය:</b> <span style="color:green; font-weight:bold;">${data.status}</span></p>
                      ${data.afterPhoto ? `<p style="margin-top:5px;"><b>පිරිසිදු කළ පසු පින්තූරය:</b></p><img src="${data.afterPhoto}" style="width:100%; max-height:150px; border-radius:4px;">` : ''}
                  `;
              } else {
                  resDiv.innerHTML = "<span style='color:red;'>මෙම ID එක සඳහා දත්ත හමු නොවීය.</span>";
              }
          } catch(e) {
              resDiv.innerHTML = "<span style='color:red;'>දෝෂයක් ඇති විය.</span>";
          }
      };
    </script>
</head>
<body>

<header>
    <h2>🍃 Clean.lk</h2>
    <button class="theme-toggle" onclick="toggleDarkMode()">🌙 ඩාක් මෝඩ්</button>
</header>

<!-- Submit Form -->
<div class="card">
    <h3>පැමිණිල්ලක් හෝ යෝජනාවක් යොමු කරන්න</h3>
    <form id="complaintForm" onsubmit="submitComplaint(event)">
        <label>නම:</label>
        <input type="text" id="userName" placeholder="ඔබේ නම...">
        <label>ස්ථානය (Location / Map Link):</label>
        <input type="text" id="userLocation" placeholder="ස්ථානය හෝ ලින්ක් එක..." required>
        <label>ඡායාරූපයක්:</label>
        <input type="file" id="userPhoto" accept="image/*">
        <label>විස්තරය:</label>
        <textarea id="userDescription" rows="3" placeholder="ගැටළුව විස්තර කරන්න..." required></textarea>
        <button type="submit">යොමු කරන්න</button>
    </form>
</div>

<!-- Status Tracking -->
<div class="card">
    <h3>පැමිණිලි තත්ත්වය පරීක්ෂා කරන්න</h3>
    <input type="text" id="trackId" placeholder="පැමිණිලි ID අංකය ඇතුළත් කරන්න...">
    <button onclick="trackStatus()" style="background: #0277bd;">පරීක්ෂා කරන්න</button>
    <div id="trackResult" style="margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.03); border-radius: 4px; display:none;"></div>
</div>

<script>
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('user_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
    window.addEventListener('DOMContentLoaded', () => {
        if(localStorage.getItem('user_theme') === 'dark') document.body.classList.add('dark-mode');
    });
</script>

</body>
</html>
