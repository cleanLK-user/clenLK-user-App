<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean.lk - Admin Panel</title>
    <style>
        :root {
            --admin-dark: #1e272e;
            --admin-card: #ffffff;
            --primary: #2e7d32;
            --accent: #d32f2f;
            --bg: #f5f6fa;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: #2c3e50;
            padding-bottom: 70px;
        }
        /* Header Bar */
        header {
            background: var(--admin-dark);
            color: white;
            text-align: center;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        header p {
            font-size: 12px;
            color: #81c784;
            margin-top: 4px;
        }
        /* Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }
        /* Fixed Navigation */
        nav.admin-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 2px solid #ddd;
            z-index: 1000;
        }
        nav.admin-nav button {
            background: none;
            border: none;
            flex: 1;
            height: 100%;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }
        nav.admin-nav button.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            background: #f0fdf4;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card {
            background: var(--admin-card);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
        }
        .image-preview {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 6px;
            margin: 8px 0;
        }
        select, button.btn-update {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        button.btn-update {
            background: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button.btn-update:hover {
            background: #1b5e20;
        }
        .warning-badge {
            background: #ffebee;
            color: #c62828;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }
        .plant-decor {
            text-align: center;
            margin: 15px 0;
            opacity: 0.7;
        }
    </style>

    <!-- Firebase App & Firestore SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, collection, getDocs, doc, updateDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      // ඔබගේ Firebase කොන්සෝලයෙන් ලබාගත් නිවැරදි විස්තර
      const firebaseConfig = {
        apiKey: "AIzaSyDtOiVEWrArAyQgqvqsU2TVI2cdTHCEisO",
        authDomain: "cleanlk-76d7a.firebaseapp.com",
        projectId: "cleanlk-76d7a",
        storageBucket: "cleanlk-76d7a.firebasestorage.app",
        messagingSenderId: "411277096952",
        appId: "1:411277096952:web:dc356b1c5c88d847b4c80d",
        measurementId: "G-E2E1L4LH88"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Admin පැත්තෙන් පැමිණිලි Firebase එකෙන් ಲೋඩ් කරගැනීම
      window.loadAdminComplaints = async function() {
          const container = document.getElementById('admin-complaints-list');
          container.innerHTML = "<p style='color:#777;'>පැමිණිලි ලබාගනිමින් පවතී...</p>";

          try {
              const querySnapshot = await getDocs(collection(db, "complaints"));
              container.innerHTML = "";

              if(querySnapshot.empty) {
                  container.innerHTML = "<p style='color:#777;'>කිසිදු පැමිණිල්ලක් ලැබී නැත.</p>";
                  return;
              }

              querySnapshot.forEach((documentSnap) => {
                  const item = documentSnap.data();
                  const docId = documentSnap.id;

                  container.innerHTML += `
                      <div class="card">
                          <p><b>👤 User:</b> ${item.user || 'User'} <span class="warning-badge">Status: ${item.status || 'සලකා බලමින් සිටියි.'}</span></p>
                          <p style="font-size:12px; color:#555;"><b>📅 දිනය/වේලාව:</b> ${item.date || ''} ${item.time || ''}</p>
                          <p style="font-size:12px; color:#555;"><b>📍 Location:</b> ${item.location || ''}</p>
                          ${item.photo ? `<img src="${item.photo}" class="image-preview">` : ''}
                          <p style="font-size:13px;"><b>විස්තරය:</b> ${item.text || 'නැත'}</p>
                          <hr style="margin:10px 0;">

                          <label style="font-size:12px; font-weight:bold;">⚙️ ක්‍රියාමාර්ගය තෝරන්න:</label>
                          <select id="status-select-${docId}" onchange="onStatusSelectChange('${docId}')">
                              <option value="සලකා බලමින් සිටියි." ${item.status==='සලකා බලමින් සිටියි.'?'selected':''}>සලකා බලමින් සිටියි.</option>
                              <option value="පිරිසිදු කරමින් සිටියි." ${item.status==='පිරිසිදු කරමින් සිටියි.'?'selected':''}>පිරිසිදු කරමින් සිටියි.</option>
                              <option value="පිරිසිදු කළා." ${item.status==='පිරිසිදු කළා.'?'selected':''}>පිරිසිදු කළා.</option>
                              <option value="අසත්‍ය තොරතුරකි." ${item.status==='අසත්‍ය තොරතුරකි.'?'selected':''}>අසත්‍ය තොරතුරකි.</option>
                          </select>

                          <div id="after-photo-upload-sec-${docId}" style="display:${item.status==='පිරිසිදු කළා.'?'block':'none'}; margin-top:10px;">
                              <label style="font-size:12px; color:#2e7d32; font-weight:bold;">📸 After Photo:</label>
                              <input type="file" id="after-photo-input-${docId}" accept="image/*">
                              ${item.afterPhoto ? `<img src="${item.afterPhoto}" class="image-preview" style="max-height:100px;">` : ''}
                          </div>

                          <button class="btn-update" onclick="updateComplaintStatus('${docId}')">ක්‍රියාමාර්ගය යාවත්කාලීන කරන්න</button>
                      </div>
                  `;
              });
          } catch (e) {
              console.error("Error loading complaints: ", e);
              container.innerHTML = "<p style='color:red;'>පැමිණිලි ලබාගැනීමේ දෝෂයක් ඇතිවිය.</p>";
          }
      };

      window.onStatusSelectChange = function(docId) {
          const selectedVal = document.getElementById(`status-select-${docId}`).value;
          const uploadSec = document.getElementById(`after-photo-upload-sec-${docId}`);
          if(uploadSec) {
              uploadSec.style.display = (selectedVal === "පිරිසිදු කළා.") ? "block" : "none";
          }
      };

      window.updateComplaintStatus = async function(docId) {
          const selectedStatus = document.getElementById(`status-select-${docId}`).value;
          const photoInput = document.getElementById(`after-photo-input-${docId}`);

          try {
              const docRef = doc(db, "complaints", docId);
              let updateData = { status: selectedStatus };

              if (selectedStatus === "පිරිසිදු කළා." && photoInput && photoInput.files[0]) {
                  const reader = new FileReader();
                  reader.onload = async function(e) {
                      updateData.afterPhoto = e.target.result;
                      await updateDoc(docRef, updateData);
                      alert("✅ ක්‍රියාමාර්ගය සාර්ථකව යාවත්කාලීන විය!");
                      loadAdminComplaints();
                  };
                  reader.readAsDataURL(photoInput.files[0]);
                  return;
              }

              await updateDoc(docRef, updateData);
              alert("✅ ක්‍රියාමාර්ගය සාර්ථකව යාවත්කාලීන විය!");
              loadAdminComplaints();
          } catch (e) {
              console.error("Error updating status: ", e);
              alert("යාවත්කාලීන කිරීමේදී දෝෂයක් ඇතිවිය.");
          }
      };

      window.loadAdminSuggestions = async function() {
          const container = document.getElementById('admin-suggestions-list');
          container.innerHTML = "<p style='color:#777;'>යෝජනා ලබාගනිමින් පවතී...</p>";
          try {
              const querySnapshot = await getDocs(collection(db, "suggestions"));
              container.innerHTML = "";
              if(querySnapshot.empty) {
                  container.innerHTML = "<p style='color:#777;'>යෝජනා නොමැත.</p>";
                  return;
              }
              querySnapshot.forEach((docSnap) => {
                  const item = docSnap.data();
                  container.innerHTML += `
                      <div class="card">
                          <p><b>👤 පරිශීලක:</b> ${item.user || ''}</p>
                          <p style="font-size:12px; color:#555;"><b>📅 දිනය:</b> ${item.date || ''} ${item.time || ''}</p>
                          <p style="margin-top:8px; font-size:14px;"><b>💡 යෝජනාව:</b> ${item.text || ''}</p>
                      </div>
                  `;
              });
          } catch(e) {
              console.error("Error loading suggestions:", e);
          }
      };

      window.addPoster = async function() {
          const title = document.getElementById('poster-title').value.trim();
          const body = document.getElementById('poster-body').value.trim();
          if(!title || !body) {
              alert("සියලු විස්තර පුරවන්න.");
              return;
          }
          try {
              await addDoc(collection(db, "posters"), {
                  title: title,
                  body: body,
                  timestamp: Date.now()
              });
              alert("පෝස්ටරය එක් කරන ලදී!");
              document.getElementById('poster-title').value = '';
              document.getElementById('poster-body').value = '';
              loadPosters();
          } catch(e) {
              console.error("Error adding poster:", e);
          }
      };

      window.loadPosters = async function() {
          const container = document.getElementById('poster-manage-list');
          container.innerHTML = "<p style='color:#777;'>පෝස්ටර් ලබාගනිමින් පවතී...</p>";
          try {
              const querySnapshot = await getDocs(collection(db, "posters"));
              container.innerHTML = "";
              if(querySnapshot.empty) {
                  container.innerHTML = "<p style='color:#777;'>පෝස්ටර් නොමැත.</p>";
                  return;
              }
              querySnapshot.forEach((docSnap) => {
                  const item = docSnap.data();
                  const docId = docSnap.id;
                  container.innerHTML += `
                      <div class="card">
                          <h4>${item.title}</h4>
                          <p style="font-size:13px; color:#555;">${item.body}</p>
                          <button class="btn-update" style="background:#e53935; margin-top:8px;" onclick="deletePoster('${docId}')">🗑️ ඉවත් කරන්න</button>
                      </div>
                  `;
              });
          } catch(e) {
              console.error("Error loading posters:", e);
          }
      };

      window.deletePoster = async function(docId) {
          try {
              await deleteDoc(doc(db, "posters", docId));
              loadPosters();
          } catch(e) {
              console.error("Error deleting poster:", e);
          }
      };

      window.addEventListener('DOMContentLoaded', () => {
          loadAdminComplaints();
      });
    </script>
</head>
<body>

<!-- Password Protection Script -->
<script>
    const adminPassword = "osha@2011"; 
    let enteredPassword = prompt("පරිපාලක (Admin) මුරපදය ඇතුළත් කරන්න:");
    
    if (enteredPassword !== adminPassword) {
        alert("වැරදි මුරපදයක්! ඔබව මුල් පිටුවට හරවන ලදී.");
        window.location.href = "index.html"; 
    }
</script>

<header> 
    <h1>🍃 Clean.lk Admin Panel</h1> 
    <p>පරිපාලන මෙහෙයුම් පද්ධතිය</p>
</header>

<div class="container">
    <!-- Admin Tab 1: ජනතා පැමිණිලි --> 
    <div id="admin-tab1" class="tab-content active"> 
        <h3 style="margin-bottom: 12px; color: var(--admin-dark);">📥 ලැබුණු ජනතා පැමිණිලි</h3> 
        <div id="admin-complaints-list"></div> 
        <div class="plant-decor">🌿 🍃 🌸 🍃 🌿</div> 
    </div>

    <!-- Admin Tab 2: පැමිණිලි හා යෝජනා --> 
    <div id="admin-tab2" class="tab-content"> 
        <h3 style="margin-bottom: 12px; color: var(--admin-dark);">👂 ජනතා සවන - යෝජනා හා අදහස්</h3> 
        <div id="admin-suggestions-list"></div> 
    </div>

    <!-- Admin Tab 3: පොස්ටර් පාලනය --> 
    <div id="admin-tab3" class="tab-content"> 
        <h3 style="margin-bottom: 12px; color: var(--admin-dark);">🖼️ පද්ධති පෝස්ටර් හා දැනුම්දීම් පාලනය</h3> 
        <div class="card"> 
            <h4>නව පෝස්ටරයක් / දැනුම්දීමක් එක් කරන්න</h4> 
            <input type="text" id="poster-title" placeholder="ශීර්ෂය..." style="width:100%; padding:8px; margin:8px 0;"> 
            <textarea id="poster-body" placeholder="විස්තරය..." style="width:100%; padding:8px; height:80px;"></textarea> 
            <button class="btn-update" onclick="addPoster()">පෝස්ටරය පලකරන්න</button> 
        </div> 
        <div id="poster-manage-list"></div> 
    </div>
</div>

<!-- Admin Bottom Navigation -->
<nav class="admin-nav"> 
    <button id="nav-admin-tab1" class="active" onclick="switchAdminTab('admin-tab1')">පැමිණිලි</button> 
    <button id="nav-admin-tab2" onclick="switchAdminTab('admin-tab2')">යෝජනා/සවන</button> 
    <button id="nav-admin-tab3" onclick="switchAdminTab('admin-tab3')">පෝස්ටර්</button>
</nav>

<script> 
    function switchAdminTab(tabId) { 
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active')); 
        document.querySelectorAll('.admin-nav button').forEach(el => el.classList.remove('active'));

        document.getElementById(tabId).classList.add('active'); 
        document.getElementById('nav-' + tabId).classList.add('active');

        if(tabId === 'admin-tab1') loadAdminComplaints(); 
        if(tabId === 'admin-tab2') loadAdminSuggestions(); 
        if(tabId === 'admin-tab3') loadPosters(); 
    }
</script>

</body>
</html>
